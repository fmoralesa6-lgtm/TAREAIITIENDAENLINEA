
services:
  blue:
    image: novatech-frontend:v1
    restart: unless-stopped

  green:
    image: novatech-frontend:v2
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blue
      - green
